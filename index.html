<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Parallax cover-img -->
    <div class="cover-image"></div>
        
        <header id="site-header" class="is--nav">
            <nav class="site-nav">
                <ul>
                    <li><a href="">Shop</a><li>
                    <li><a href="">Article</a></li>
                    <li><a href="">Contact</a></li>
                </ul>
                <div class="site-title" id="title">
                    <h1>Maximize Profit</h1>
                </div>
                <div class="copy-right">
                    <p>&copy; 2026 All Rights Reserved</p>
                </div>
            </nav>
        </header>

        <main id="site-main">
            <section class="discover" id="discover">
                <div class="container">
                    <div class="slide">
                        <h1 class="slide1">Discover</h1>
                    </div>
                    <div class="slide">
                        <h1 class="slide2 lightWidth">latest trend</h1>
                    </div>
                    <div class="slide">
                        <h1 class="slide3">minimal</h1>
                    </div>
                    <div class="slide">
                        <h1 class="slide4">effort</h1>
                    </div>
                </div>
            </section>

            <section class="image-section" id="image-section">
                <div class="container">
                    <div class="cover">
                        <img src="./assets /section2.png" alt="" id="img_section2">
                    </div>
                
                </div>
            </section>

            <section class="tag-section" id="tag-section">
                <div class="container">
                    <span>Home</span>
                    <span>Travel</span>
                    <span>Furniture</span>
                    <span>Book</span>
                    <span>Office</span>
                    <span>Kitchen</span>
                    <span>Lightning</span>
                    <span>Fashion</span>
                    <span>Bath & Bed</span>
                    <span>Tech</span>
                    <span>Decor</span>
                    <span>More</span>
                </div>
            </section>

            <section class="furniture-section" id="furniture-section">
                <div class="container">
                    <div class="furniture-title">
                        <h2>Furniture</h2>
                    </div>

                    <div class="grid-wrapper">
                        <div class="grid-items">
                       <div class="box">
                        <img src="/assets /furniture_1.jpg" alt="furniture_1">
                       </div>
                        <div class="box">
                        <img src="/assets /furniture_2.jpg" alt="">
                       </div>
                        <div class="box">
                        <img src="/assets /furniture_3.jpg" alt="">
                       </div>
                        <div class="box">
                        <img src="/assets /furniture_4.jpg" alt="">
                       </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollToPlugin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>

    <script src="script.js"></script>
</body>
</html>
